<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ClassFlow - Gestion de Participation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Effet de fond dynamique */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(45, 62, 80, 0.4) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(52, 152, 219, 0.4) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Particules animées */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: float 10s infinite linear;
            z-index: -1;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
        }

        /* Header avec effet liquide */
        .header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 25px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 20px 30px;
            }
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: liquidMove 15s infinite linear;
            pointer-events: none;
        }

        @keyframes liquidMove {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a8c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        @media (min-width: 768px) {
            .logo {
                font-size: 28px;
                text-align: left;
            }
        }

        .greeting-message {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            animation: glowPulse 3s infinite;
            text-align: center;
            width: 100%;
        }

        @media (min-width: 768px) {
            .greeting-message {
                font-size: 18px;
                padding: 12px 25px;
                width: auto;
            }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(52, 152, 219, 0.2); }
            50% { box-shadow: 0 0 30px rgba(52, 152, 219, 0.4); }
        }

        /* Login Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .login-form {
                flex-direction: row;
                width: auto;
            }
        }

        .login-input {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: white;
            font-size: 14px;
            transition: all 0.3s;
            width: 100%;
        }

        @media (min-width: 768px) {
            .login-input {
                width: 150px;
                padding: 12px 20px;
            }
        }

        .login-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.3);
        }

        .login-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .login-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            width: 100%;
            font-size: 14px;
        }

        @media (min-width: 768px) {
            .login-btn {
                width: auto;
                padding: 12px 25px;
                font-size: 16px;
            }
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .login-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        /* Stats Cards */
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .stats-overview {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
                margin-bottom: 30px;
            }
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 10px;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .stat-card {
                padding: 25px;
                border-radius: 25px;
            }
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .stat-card:hover::after {
            opacity: 1;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(52, 152, 219, 0.5);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a8c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        @media (min-width: 768px) {
            .stat-value {
                font-size: 42px;
            }
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (min-width: 768px) {
            .stat-label {
                font-size: 14px;
                letter-spacing: 1px;
            }
        }

        /* Search Bar */
        .search-bar {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: white;
            font-size: 14px;
            transition: all 0.3s;
        }

        @media (min-width: 768px) {
            .search-input {
                padding: 18px 25px;
                font-size: 16px;
            }
        }

        .search-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 30px rgba(52, 152, 219, 0.2);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Élèves Grid avec Drag & Drop */
        .eleves-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 15px;
            min-height: 400px;
        }

        @media (min-width: 600px) {
            .eleves-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .eleves-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 25px;
                margin-top: 20px;
            }
        }

        @media (min-width: 1400px) {
            .eleves-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .eleve-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 25px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: grab;
            position: relative;
        }

        @media (min-width: 768px) {
            .eleve-card {
                border-radius: 30px;
            }
        }

        .eleve-card.dragging {
            opacity: 0.5;
            transform: scale(1.02);
            cursor: grabbing;
        }

        .eleve-card.drag-over {
            border: 2px solid #3498db;
            transform: scale(1.02);
        }

        .eleve-card:hover {
            transform: translateY(-5px) scale(1.01);
            border-color: rgba(52, 152, 219, 0.5);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        @media (min-width: 768px) {
            .eleve-card:hover {
                transform: translateY(-10px) scale(1.02);
            }
        }

        .eleve-photo {
            width: 100%;
            height: 180px;
            object-fit: cover;
            cursor: pointer;
            transition: all 0.5s;
            position: relative;
        }

        @media (min-width: 768px) {
            .eleve-photo {
                height: 250px;
            }
        }

        .eleve-card:hover .eleve-photo {
            transform: scale(1.05);
        }

        .eleve-info {
            padding: 15px;
            position: relative;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }

        @media (min-width: 768px) {
            .eleve-info {
                padding: 25px;
            }
        }

        .eleve-nom {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin-bottom: 5px;
        }

        @media (min-width: 768px) {
            .eleve-nom {
                font-size: 24px;
                margin-bottom: 10px;
            }
        }

        .eleve-points {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
            text-shadow: 0 0 30px rgba(52, 152, 219, 0.3);
        }

        @media (min-width: 768px) {
            .eleve-points {
                font-size: 48px;
                margin: 15px 0;
            }
        }

        .point-controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        @media (min-width: 768px) {
            .point-controls {
                display: flex;
                gap: 10px;
                margin-top: 20px;
            }
        }

        .btn-point {
            padding: 10px 5px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            font-size: 14px;
        }

        @media (min-width: 768px) {
            .btn-point {
                padding: 12px;
                border-radius: 15px;
                font-size: 16px;
                flex: 1;
            }
        }

        .btn-point::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-point:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-plus {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        .btn-moins {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        /* Modal Glass */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 30px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlide 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @media (min-width: 768px) {
            .modal-content {
                padding: 40px;
                border-radius: 40px;
            }
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 24px;
        }

        @media (min-width: 768px) {
            .modal h2 {
                font-size: 28px;
                margin-bottom: 25px;
            }
        }

        .modal input, .modal textarea, .modal select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            margin: 8px 0;
            font-size: 14px;
        }

        @media (min-width: 768px) {
            .modal input, .modal textarea, .modal select {
                padding: 15px 20px;
                border-radius: 20px;
                margin: 10px 0;
                font-size: 16px;
            }
        }

        .modal input:focus {
            outline: none;
            border-color: #3498db;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed rgba(52, 152, 219, 0.5);
            padding: 20px;
            text-align: center;
            border-radius: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        @media (min-width: 768px) {
            .upload-area {
                padding: 30px;
                border-radius: 20px;
                margin: 15px 0;
                font-size: 16px;
            }
        }

        .upload-area:hover {
            border-color: #3498db;
            background: rgba(52, 152, 219, 0.1);
        }

        .photo-preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            margin: 10px 0;
            border: 3px solid #3498db;
        }

        @media (min-width: 768px) {
            .photo-preview {
                height: 200px;
                border-radius: 20px;
                margin: 15px 0;
            }
        }

        /* Buttons */
        .btn-primary, .btn-secondary, .btn-danger {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            width: 100%;
            margin: 5px 0;
        }

        @media (min-width: 768px) {
            .btn-primary, .btn-secondary, .btn-danger {
                padding: 15px 30px;
                font-size: 16px;
                width: auto;
                margin: 0;
            }
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-primary:hover, .btn-secondary:hover, .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        @media (min-width: 768px) {
            .modal-actions {
                flex-direction: row;
                gap: 10px;
                margin-top: 20px;
            }
        }

        /* Floating Action Button */
        .add-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            z-index: 100;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 768px) {
            .add-btn {
                bottom: 40px;
                right: 40px;
                width: 70px;
                height: 70px;
                font-size: 30px;
            }
        }

        .add-btn:hover {
            transform: rotate(90deg) scale(1.1);
        }

        /* Loading Spinner */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @media (min-width: 768px) {
            .spinner {
                width: 60px;
                height: 60px;
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Import/Export Buttons */
        .import-export {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .import-export {
                flex-direction: row;
                gap: 10px;
                margin-top: 0;
                width: auto;
            }
        }

        .icon-btn {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .icon-btn {
                padding: 12px 20px;
                font-size: 14px;
                width: auto;
            }
        }

        .icon-btn:hover {
            background: rgba(52, 152, 219, 0.2);
            border-color: #3498db;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 600;
            margin-right: 5px;
        }

        @media (min-width: 768px) {
            .badge {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        .badge-success {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .badge-danger {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }

        /* Admin Info */
        #adminInfo {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        @media (min-width: 768px) {
            #adminInfo {
                flex-direction: row;
                width: auto;
            }
        }

        #adminInfo span {
            color: white;
            font-size: 14px;
        }

        /* Drag handle indicator */
        .eleve-card[draggable="true"] {
            position: relative;
        }

        .eleve-card[draggable="true"]::after {
            content: '⋮⋮';
            position: absolute;
            top: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 20px;
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <!-- Particules animées -->
    <div id="particles"></div>

    <div class="container">
        <!-- Header avec message personnalisé -->
        <div class="header">
            <div class="logo">📚 ClassFlow</div>
            <div class="greeting-message" id="greetingMessage">
                👋 Bonjour, invité
            </div>
            <div class="admin-badge" id="adminSection">
                <div id="loginForm" class="login-form">
                    <input type="password" id="passwordInput" class="login-input" placeholder="Mot de passe prof" value="prof2024">
                    <input type="text" id="profName" class="login-input" placeholder="Votre prénom">
                    <button onclick="login()" class="login-btn">Connexion</button>
                </div>
                <div id="adminInfo" style="display: none;">
                    <span>👨‍🏫 Mode Admin</span>
                    <button onclick="logout()" class="login-btn">Déconnexion</button>
                </div>
            </div>
        </div>

        <!-- Barre de recherche -->
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Rechercher un élève..." onkeyup="filterEleves()">
        </div>

        <!-- Stats overview -->
        <div class="stats-overview">
            <div class="stat-card">
                <div class="stat-value" id="totalEleves">0</div>
                <div class="stat-label">Élèves</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalPoints">0</div>
                <div class="stat-label">Points totaux</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="moyennePoints">0</div>
                <div class="stat-label">Moyenne</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="topEleve">-</div>
                <div class="stat-label">Meilleur élève</div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: white;">Chargement des élèves...</p>
        </div>

        <!-- Grille des élèves (drag & drop) -->
        <div class="eleves-grid" id="elevesGrid"></div>
    </div>

    <!-- Bouton ajout (admin seulement) -->
    <button class="add-btn" id="addBtn" onclick="showAddModal()" style="display: none;">+</button>

    <!-- Modal Ajout Élève -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>Ajouter un élève</h2>
            <input type="text" id="newNom" placeholder="Nom">
            <input type="text" id="newPrenom" placeholder="Prénom">
            
            <div class="upload-area" onclick="document.getElementById('newPhoto').click()">
                📸 Cliquez pour ajouter une photo
            </div>
            <input type="file" id="newPhoto" accept="image/*" style="display: none;" onchange="previewImage(event)">
            <img id="photoPreview" class="photo-preview" style="display: none;">

            <div class="modal-actions">
                <button onclick="addEleve()" class="btn-primary">Ajouter</button>
                <button onclick="hideAddModal()" class="btn-secondary">Annuler</button>
            </div>
        </div>
    </div>

    <!-- Modal Détails Élève -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <h2 id="detailNom">Détails</h2>
            <img id="detailPhoto" class="photo-preview">
            <div id="detailStats"></div>
            <div id="historiquePoints"></div>
            <div class="modal-actions">
                <button onclick="hideDetailsModal()" class="btn-secondary">Fermer</button>
                <button id="deleteBtn" onclick="deleteEleve()" class="btn-danger" style="display: none;">Supprimer</button>
            </div>
        </div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const ADMIN_PASSWORD = 'prof2024';
        let isAdmin = false;
        let currentEleveId = null;
        let profPrenom = '';

        // ===== CRÉATION DES PARTICULES =====
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (10 + Math.random() * 20) + 's';
                particle.style.width = (2 + Math.random() * 4) + 'px';
                particle.style.height = particle.style.width;
                particlesContainer.appendChild(particle);
            }
        }

        // ===== GESTIONNAIRE PRINCIPAL =====
        class ParticipationManager {
            constructor() {
                this.eleves = this.loadEleves();
                this.historique = this.loadHistorique();
                this.initDragAndDrop();
            }

            loadEleves() {
                const saved = localStorage.getItem('eleves');
                return saved ? JSON.parse(saved) : [];
            }

            loadHistorique() {
                const saved = localStorage.getItem('historique');
                return saved ? JSON.parse(saved) : [];
            }

            saveEleves() {
                localStorage.setItem('eleves', JSON.stringify(this.eleves));
                this.updateStats();
                this.displayEleves();
            }

            saveHistorique() {
                localStorage.setItem('historique', JSON.stringify(this.historique));
            }

            // Drag & Drop
            initDragAndDrop() {
                let draggedItem = null;

                document.addEventListener('dragstart', (e) => {
                    if (e.target.classList.contains('eleve-card')) {
                        draggedItem = e.target;
                        e.target.classList.add('dragging');
                        e.dataTransfer.setData('text/plain', e.target.dataset.id);
                    }
                });

                document.addEventListener('dragend', (e) => {
                    if (e.target.classList.contains('eleve-card')) {
                        e.target.classList.remove('dragging');
                    }
                });

                document.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });

                document.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const grid = document.getElementById('elevesGrid');
                    const target = e.target.closest('.eleve-card');
                    
                    if (target && draggedItem && target !== draggedItem) {
                        const draggedId = draggedItem.dataset.id;
                        const targetId = target.dataset.id;
                        
                        const draggedIndex = this.eleves.findIndex(e => e.id === draggedId);
                        const targetIndex = this.eleves.findIndex(e => e.id === targetId);
                        
                        const [draggedEleve] = this.eleves.splice(draggedIndex, 1);
                        this.eleves.splice(targetIndex, 0, draggedEleve);
                        
                        this.saveEleves();
                        this.addHistorique({
                            action: 'Réorganisation',
                            details: 'Ordre modifié'
                        });
                    }
                    
                    document.querySelectorAll('.eleve-card').forEach(c => c.classList.remove('drag-over'));
                });
            }

            // CRUD
            addEleve(eleve) {
                const newEleve = {
                    ...eleve,
                    id: Date.now().toString(),
                    points: 0,
                    dateAjout: new Date().toISOString()
                };
                this.eleves.push(newEleve);
                this.saveEleves();
                this.addHistorique({
                    eleveId: newEleve.id,
                    action: 'Ajout',
                    details: `${newEleve.prenom} ${newEleve.nom}`
                });
                return newEleve;
            }

            updatePoints(eleveId, points, raison = '') {
                const eleve = this.eleves.find(e => e.id === eleveId);
                if (eleve) {
                    const oldPoints = eleve.points || 0;
                    eleve.points = oldPoints + points;
                    this.saveEleves();
                    this.addHistorique({
                        eleveId,
                        action: points > 0 ? `+${points}` : points,
                        details: raison || 'Participation'
                    });
                }
            }

            deleteEleve(eleveId) {
                const eleve = this.eleves.find(e => e.id === eleveId);
                this.eleves = this.eleves.filter(e => e.id !== eleveId);
                this.saveEleves();
                this.addHistorique({
                    action: 'Suppression',
                    details: eleve ? `${eleve.prenom} ${eleve.nom}` : 'Élève supprimé'
                });
            }

            addHistorique(entry) {
                this.historique.unshift({
                    ...entry,
                    id: Date.now() + Math.random(),
                    date: new Date().toLocaleString()
                });
                if (this.historique.length > 100) this.historique.pop();
                this.saveHistorique();
            }

            getHistorique(eleveId) {
                return this.historique.filter(h => h.eleveId === eleveId);
            }

            // Stats
            getStats() {
                const total = this.eleves.length;
                const totalPoints = this.eleves.reduce((acc, e) => acc + (e.points || 0), 0);
                const moyenne = total > 0 ? (totalPoints / total).toFixed(1) : 0;
                
                let top = null;
                if (this.eleves.length > 0) {
                    top = this.eleves.reduce((max, e) => 
                        (e.points || 0) > (max.points || 0) ? e : max, this.eleves[0]);
                }

                return { total, totalPoints, moyenne, top };
            }

            // Affichage
            displayEleves() {
                const grid = document.getElementById('elevesGrid');
                const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
                
                const filtered = this.eleves.filter(e => 
                    e.nom.toLowerCase().includes(searchTerm) || 
                    e.prenom.toLowerCase().includes(searchTerm)
                );

                if (filtered.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; background: rgba(255,255,255,0.03); border-radius: 25px; color: rgba(255,255,255,0.5);">Aucun élève trouvé</div>';
                    return;
                }

                grid.innerHTML = filtered.map(eleve => `
                    <div class="eleve-card" draggable="${isAdmin}" data-id="${eleve.id}">
                        <img class="eleve-photo" 
                             src="${eleve.photo || 'https://images.unsplash.com/photo-1511367461989-f85a21fda167?w=400'}" 
                             alt="${eleve.prenom}"
                             onclick="showDetails('${eleve.id}')"
                             onerror="this.src='https://images.unsplash.com/photo-1511367461989-f85a21fda167?w=400'">
                        <div class="eleve-info">
                            <div class="eleve-nom">${eleve.prenom} ${eleve.nom}</div>
                            <div class="eleve-points">${eleve.points || 0} pts</div>
                            ${isAdmin ? `
                                <div class="point-controls">
                                    <button class="btn-point btn-plus" onclick="event.stopPropagation(); addPoints('${eleve.id}', 1)">+1</button>
                                    <button class="btn-point btn-plus" onclick="event.stopPropagation(); addPoints('${eleve.id}', 5)">+5</button>
                                    <button class="btn-point btn-plus" onclick="event.stopPropagation(); addPoints('${eleve.id}', 10)">+10</button>
                                    <button class="btn-point btn-moins" onclick="event.stopPropagation(); addPoints('${eleve.id}', -1)">-1</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            }

            updateStats() {
                const stats = this.getStats();
                document.getElementById('totalEleves').textContent = stats.total;
                document.getElementById('totalPoints').textContent = stats.totalPoints;
                document.getElementById('moyennePoints').textContent = stats.moyenne;
                document.getElementById('topEleve').textContent = stats.top ? 
                    `${stats.top.prenom} (${stats.top.points})` : '-';
            }

            // Import/Export
            exportData() {
                const data = {
                    eleves: this.eleves,
                    historique: this.historique,
                    date: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `classe_backup_${new Date().toLocaleDateString()}.json`;
                a.click();
            }

            importData(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        this.eleves = data.eleves || [];
                        this.historique = data.historique || [];
                        this.saveEleves();
                        this.saveHistorique();
                        this.displayEleves();
                        alert('Import réussi !');
                    } catch (error) {
                        alert('Fichier invalide');
                    }
                };
                reader.readAsText(file);
            }

            showNotification(message, type = 'success') {
                alert(message);
            }
        }

        // ===== INIT =====
        const manager = new ParticipationManager();

        // ===== AUTH =====
        function login() {
            const password = document.getElementById('passwordInput').value;
            const prenom = document.getElementById('profName').value;
            
            if (password === ADMIN_PASSWORD) {
                isAdmin = true;
                profPrenom = prenom || 'Professeur';
                
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminInfo').style.display = 'flex';
                document.getElementById('addBtn').style.display = 'flex';
                
                updateGreeting();
                
                document.body.classList.add('admin-mode');
                manager.displayEleves();
                
                addImportExportButtons();
                
                alert(`Bonjour ${profPrenom} !`);
            } else {
                alert('Mot de passe incorrect');
            }
        }

        function updateGreeting() {
            const hours = new Date().getHours();
            let timeGreeting = '';
            
            if (hours < 12) timeGreeting = 'Bonjour';
            else if (hours < 18) timeGreeting = 'Bon après-midi';
            else timeGreeting = 'Bonsoir';
            
            const message = `👋 ${timeGreeting}, ${profPrenom || 'invité'}`;
            document.getElementById('greetingMessage').textContent = message;
        }

        function logout() {
            isAdmin = false;
            profPrenom = '';
            document.getElementById('loginForm').style.display = 'flex';
            document.getElementById('adminInfo').style.display = 'none';
            document.getElementById('addBtn').style.display = 'none';
            document.body.classList.remove('admin-mode');
            updateGreeting();
            manager.displayEleves();
            removeImportExportButtons();
        }

        function addImportExportButtons() {
            const header = document.querySelector('.header');
            const buttons = document.createElement('div');
            buttons.className = 'import-export';
            buttons.id = 'importExport';
            buttons.innerHTML = `
                <button onclick="exportData()" class="icon-btn">📥 Export</button>
                <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(this.files[0])">
                <button onclick="document.getElementById('importFile').click()" class="icon-btn">📤 Import</button>
                <button onclick="showClassement()" class="icon-btn">🏆 Classement</button>
            `;
            header.appendChild(buttons);
        }

        function removeImportExportButtons() {
            const buttons = document.getElementById('importExport');
            if (buttons) buttons.remove();
        }

        // ===== GESTION ÉLÈVES =====
        function addPoints(eleveId, points) {
            if (!isAdmin) return;
            const raison = prompt('Raison (optionnelle):', 'Participation');
            if (raison !== null) {
                manager.updatePoints(eleveId, points, raison);
            }
        }

        function showAddModal() {
            document.getElementById('addModal').style.display = 'flex';
        }

        function hideAddModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('newNom').value = '';
            document.getElementById('newPrenom').value = '';
            document.getElementById('photoPreview').style.display = 'none';
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const preview = document.getElementById('photoPreview');
                preview.src = reader.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        function addEleve() {
            const nom = document.getElementById('newNom').value;
            const prenom = document.getElementById('newPrenom').value;
            const photoPreview = document.getElementById('photoPreview');
            
            if (!nom || !prenom) {
                alert('Veuillez remplir le nom et prénom');
                return;
            }

            manager.addEleve({
                nom,
                prenom,
                photo: photoPreview.src || null
            });

            hideAddModal();
        }

        // ===== DÉTAILS ÉLÈVE =====
        function showDetails(eleveId) {
            currentEleveId = eleveId;
            const eleve = manager.eleves.find(e => e.id === eleveId);
            if (!eleve) return;

            document.getElementById('detailNom').textContent = `${eleve.prenom} ${eleve.nom}`;
            document.getElementById('detailPhoto').src = eleve.photo || 'https://images.unsplash.com/photo-1511367461989-f85a21fda167?w=400';
            
            const stats = `
                <div style="margin: 20px 0; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 20px;">
                    <h3 style="color: white; margin-bottom: 15px;">Statistiques</h3>
                    <p style="color: rgba(255,255,255,0.8);">Points: <span style="color: #3498db; font-weight: bold;">${eleve.points || 0}</span></p>
                    <p style="color: rgba(255,255,255,0.8);">Moyenne: <span style="color: #3498db;">${manager.getStats().moyenne}</span></p>
                    <p style="color: rgba(255,255,255,0.8);">Date d'ajout: <span style="color: #3498db;">${new Date(eleve.dateAjout).toLocaleDateString()}</span></p>
                </div>
            `;
            document.getElementById('detailStats').innerHTML = stats;

            const historique = manager.getHistorique(eleveId);
            const historiqueHtml = `
                <h3 style="color: white; margin-bottom: 15px;">Historique</h3>
                <div style="max-height: 200px; overflow-y: auto; background: rgba(255,255,255,0.03); border-radius: 15px; padding: 15px;">
                    ${historique.length > 0 ? historique.map(h => `
                        <div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <span>
                                <span class="badge ${h.action.includes('+') ? 'badge-success' : h.action.includes('-') ? 'badge-danger' : ''}">${h.action}</span>
                                ${h.details ? `<span style="color: rgba(255,255,255,0.7); margin-left: 10px;">${h.details}</span>` : ''}
                            </span>
                            <span style="color: rgba(255,255,255,0.5); font-size: 12px;">${h.date}</span>
                        </div>
                    `).join('') : '<p style="color: rgba(255,255,255,0.5); text-align: center;">Aucun historique</p>'}
                </div>
            `;
            document.getElementById('historiquePoints').innerHTML = historiqueHtml;

            document.getElementById('deleteBtn').style.display = isAdmin ? 'block' : 'none';

            document.getElementById('detailsModal').style.display = 'flex';
        }

        function hideDetailsModal() {
            document.getElementById('detailsModal').style.display = 'none';
            currentEleveId = null;
        }

        function deleteEleve() {
            if (!isAdmin || !currentEleveId) return;
            if (confirm('Supprimer cet élève ?')) {
                manager.deleteEleve(currentEleveId);
                hideDetailsModal();
                manager.displayEleves();
            }
        }

        // ===== RECHERCHE =====
        function filterEleves() {
            manager.displayEleves();
        }

        // ===== CLASSEMENT =====
        function showClassement() {
            const classement = [...manager.eleves].sort((a, b) => (b.points || 0) - (a.points || 0));
            let message = 'CLASSEMENT\n\n';
            classement.forEach((eleve, index) => {
                message += `${index + 1}. ${eleve.prenom} ${eleve.nom} : ${eleve.points || 0} pts\n`;
            });
            alert(message);
        }

        // ===== IMPORT/EXPORT =====
        function exportData() {
            manager.exportData();
        }

        function importData(file) {
            manager.importData(file);
        }

        // ===== INIT =====
        window.addEventListener('load', () => {
            createParticles();
            manager.displayEleves();
            updateGreeting();
            setInterval(updateGreeting, 60000);
        });
    </script>
</body>
</html>
